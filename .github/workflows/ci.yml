name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: policy-and-integration
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, makepad]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate PostgreSQL deployment contract
        run: ./scripts/validate-postgres-config.sh
      - name: Check deployment shell scripts
        run: >-
          shellcheck
          scripts/run-brio-encrypted-backup.sh
          scripts/run-brio-encrypted-backup-loop.sh
          scripts/deploy-postgres-stack.sh
          scripts/verify-brio-encrypted-restore.sh
          scripts/test-brio-bootstrap.sh
          scripts/test-brio-encrypted-backup.sh
          scripts/test-brio-encrypted-restore.sh
      - name: Test idempotent Brio bootstraps
        run: ./scripts/test-brio-bootstrap.sh
      - name: Test Brio encrypted backup publication
        run: ./scripts/test-brio-encrypted-backup.sh
      - name: Test Brio encrypted restore safeguards
        run: ./scripts/test-brio-encrypted-restore.sh
      - name: Test backup contracts in the pinned runtime image
        run: |
          backup_image=$(grep '^BRIO_BACKUP_IMAGE=' envs/canary/.env.db | cut -d= -f2-)
          docker run --rm --volume "${PWD}:/repo:ro" --workdir /repo "${backup_image}" bash scripts/test-brio-encrypted-backup.sh
          docker run --rm --volume "${PWD}:/repo:ro" --workdir /repo "${backup_image}" bash scripts/test-brio-encrypted-restore.sh
