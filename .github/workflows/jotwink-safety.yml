name: Jotwink database safety
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, makepad]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Database bootstrap, HBA and restore guard regression tests
        run: python3 scripts/test-jotwink-safety.py
      - name: Real encrypted database restore over verified TLS
        run: python3 scripts/test-jotwink-encrypted-restore.py
      - name: Encryption contract (mock database dump)
        run: bash scripts/test-jotwink-backup.sh
      - name: Configuration and shell syntax
        run: |
          bash scripts/validate-jotwink-config.sh
          bash -n scripts/verify-jotwink-restore.sh
