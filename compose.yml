services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2}
    environment:
      # Keep the data path explicit across the PostgreSQL 18 official-image
      # layout change. A major-version preflight prevents mounting PG16 data.
      PGDATA: /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/run/secrets/postgres_server.key
      - -c
      - hba_file=/etc/postgresql/runtrace-pg_hba.conf
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      db:
        aliases:
          - makepad-postgres
      le_petit_coin:
        aliases:
          - makepad-postgres-le-petit-coin
    configs:
      - source: postgres_tls_cert
        target: /etc/postgresql/tls/server.crt
        mode: 0444
      - source: runtrace_pg_hba
        target: /etc/postgresql/runtrace-pg_hba.conf
        mode: 0444
    secrets:
      - source: postgres_tls_key
        target: postgres_server.key
        uid: "70"
        gid: "70"
        mode: 0400

networks:
  db:
  le_petit_coin:

configs:
  postgres_tls_cert:
    external: true
    name: ${MAKEPAD_POSTGRES_TLS_CERT_CONFIG:?set MAKEPAD_POSTGRES_TLS_CERT_CONFIG}
  runtrace_pg_hba:
    external: true
    name: ${MAKEPAD_POSTGRES_RUNTRACE_HBA_CONFIG:?set MAKEPAD_POSTGRES_RUNTRACE_HBA_CONFIG}
  runtrace_backup_script:
    file: ./scripts/run-runtrace-backup.sh
  runtrace_backup_loop_script:
    file: ./scripts/run-runtrace-backup-loop.sh

secrets:
  postgres_tls_key:
    external: true
    name: ${MAKEPAD_POSTGRES_TLS_KEY_SECRET:?set MAKEPAD_POSTGRES_TLS_KEY_SECRET}
