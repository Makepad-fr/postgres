services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777}
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      db:
        aliases:
          - makepad-postgres
      le_petit_coin:
        aliases:
          - makepad-postgres-le-petit-coin

networks:
  db:
  le_petit_coin:
