# Runtrace, Jotwink, and BetaCrew customer/identity traffic must use TLS.
# Jotwink and BetaCrew are source-restricted to the app WireGuard peer and Keycloak host.
# Other shared databases retain their current SCRAM policy during migration.
local   all                 all                                     trust
hostnossl amiary           all                 all                 reject
hostnossl amiary_canary    all                 all                 reject
hostnossl keycloak_amiary  all                 all                 reject
hostssl amiary              all                 all                 scram-sha-256
hostssl amiary_canary       all                 all                 scram-sha-256
hostssl keycloak_amiary     all                 all                 scram-sha-256
hostssl runtrace,keycloak_runtrace makepad_backup all scram-sha-256
host    all                 amiary_migrator,amiary_api_prod,amiary_worker_prod,amiary_canary_migrator,amiary_api_canary,amiary_worker_canary,keycloak_amiary_app,makepad_backup all reject
hostnossl runtrace          all                 all                 reject
hostnossl keycloak_runtrace all                 all                 reject
hostnossl brio_staging      all                 all                 reject
hostnossl keycloak_brio_staging all             all                 reject
hostssl runtrace            all                 all                 scram-sha-256
hostssl keycloak_runtrace   all                 all                 scram-sha-256
hostnossl jotwink           all                 all                 reject
hostnossl keycloak_jotwink  all                 all                 reject
hostssl jotwink             jotwink_app         10.80.0.1/32        scram-sha-256
hostssl keycloak_jotwink    keycloak_jotwink_app 88.99.209.165/32   scram-sha-256
hostssl jotwink             postgres            127.0.0.1/32        scram-sha-256
hostssl keycloak_jotwink    postgres            127.0.0.1/32        scram-sha-256
hostssl jotwink             all                 all                 reject
hostssl keycloak_jotwink    all                 all                 reject
hostnossl betacrew          all                 all                 reject
hostnossl keycloak_betacrew all                 all                 reject
hostssl betacrew            betacrew_app         10.80.0.1/32        scram-sha-256
hostssl keycloak_betacrew   keycloak_betacrew_app 88.99.209.165/32   scram-sha-256
hostssl betacrew            postgres             127.0.0.1/32        scram-sha-256
hostssl keycloak_betacrew   postgres             127.0.0.1/32        scram-sha-256
hostssl betacrew            all                  all                 reject
hostssl keycloak_betacrew   all                  all                 reject
hostssl brio_staging        brio_staging_app    all                 scram-sha-256
hostssl brio_staging        brio_staging_backup all                 scram-sha-256
hostssl keycloak_brio_staging keycloak_brio_staging_app all        scram-sha-256
hostssl keycloak_brio_staging keycloak_brio_staging_backup 127.0.0.1/32 scram-sha-256
host    all                 brio_staging_app    all                 reject
host    all                 brio_staging_backup all                 reject
host    all                 keycloak_brio_staging_app all           reject
host    all                 keycloak_brio_staging_backup all        reject
host    all                 all                 all                 scram-sha-256
