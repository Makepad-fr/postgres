# Insert before the shared catch-all only after a private identity path is verified.
# Application connections arrive over the existing app-to-DB WireGuard path.
hostnossl visitaki          all                  all          reject
hostnossl keycloak_visitaki all                  all          reject
hostssl   visitaki          visitaki_app         10.80.0.1/32 scram-sha-256
hostssl   visitaki          visitaki_app         127.0.0.1/32 scram-sha-256
hostssl   keycloak_visitaki keycloak_visitaki_app 127.0.0.1/32 scram-sha-256
# Deliberately no public Keycloak VM source: Visitaki requires private connectivity.
host      visitaki,keycloak_visitaki all          all          reject
host      all visitaki_app,keycloak_visitaki_app   all          reject
