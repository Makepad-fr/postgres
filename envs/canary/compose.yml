services:
  postgres:
    env_file:
      - ./envs/canary/.env.db
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    volumes:
      - "${MAKEPAD_POSTGRES_DATA_PATH:-/var/lib/makepad/postgres-canary}:/var/lib/postgresql/data"
      - "${MAKEPAD_POSTGRES_SUPERUSER_PASSWORD_FILE_HOST_PATH:?set MAKEPAD_POSTGRES_SUPERUSER_PASSWORD_FILE_HOST_PATH}:/run/secrets/postgres_superuser_password:ro"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.infra.makepad.postgres == true
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          cpus: "${MAKEPAD_POSTGRES_CPU_LIMIT:-1.0}"
          memory: ${MAKEPAD_POSTGRES_MEMORY_LIMIT:-2G}
        reservations:
          cpus: "${MAKEPAD_POSTGRES_CPU_RESERVATION:-0.25}"
          memory: ${MAKEPAD_POSTGRES_MEMORY_RESERVATION:-256M}
    networks:
      brio_staging:
        aliases:
          - makepad-postgres-brio-staging

  brio_staging_backup:
    image: ${BRIO_BACKUP_IMAGE:?set BRIO_BACKUP_IMAGE}
    user: "999:999"
    command:
      - /usr/local/bin/run-brio-encrypted-backup-loop.sh
    environment:
      PGHOST: makepad-postgres-brio-staging
      PGPORT: "5432"
      PGUSER: brio_staging_backup
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /etc/postgresql/ca.crt
      POSTGRES_BACKUP_PASSWORD_FILE: /run/secrets/postgres_backup_password
      BRIO_BACKUP_DATABASE: brio_staging
      BRIO_BACKUP_ROOT: /backups
      BRIO_BACKUP_RECIPIENT_CERT: /etc/postgresql/brio-backup-recipient.crt
      BRIO_BACKUP_INTERVAL_SECONDS: ${MAKEPAD_POSTGRES_BRIO_BACKUP_INTERVAL_SECONDS:-21600}
      BRIO_BACKUP_RETRY_SECONDS: ${MAKEPAD_POSTGRES_BRIO_BACKUP_RETRY_SECONDS:-300}
      BRIO_BACKUP_RETENTION_DAYS: ${MAKEPAD_POSTGRES_BRIO_BACKUP_RETENTION_DAYS:-35}
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=999,gid=999
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/run-brio-encrypted-backup-loop.sh", "healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m
    networks:
      - brio_staging
    volumes:
      - "${MAKEPAD_POSTGRES_BRIO_APP_BACKUP_PATH:?set MAKEPAD_POSTGRES_BRIO_APP_BACKUP_PATH}:/backups"
      - "${MAKEPAD_POSTGRES_BRIO_APP_BACKUP_PASSWORD_FILE_HOST_PATH:?set MAKEPAD_POSTGRES_BRIO_APP_BACKUP_PASSWORD_FILE_HOST_PATH}:/run/secrets/postgres_backup_password:ro"
      - "${MAKEPAD_POSTGRES_CA_CERT_HOST_PATH:?set MAKEPAD_POSTGRES_CA_CERT_HOST_PATH}:/etc/postgresql/ca.crt:ro"
      - "${MAKEPAD_POSTGRES_BRIO_BACKUP_RECIPIENT_CERT_HOST_PATH:?set MAKEPAD_POSTGRES_BRIO_BACKUP_RECIPIENT_CERT_HOST_PATH}:/etc/postgresql/brio-backup-recipient.crt:ro"
    configs:
      - source: brio_encrypted_backup_script
        target: /usr/local/bin/run-brio-encrypted-backup.sh
        mode: 0555
      - source: brio_encrypted_backup_loop_script
        target: /usr/local/bin/run-brio-encrypted-backup-loop.sh
        mode: 0555
    logging:
      driver: json-file
      options:
        max-size: "${MAKEPAD_POSTGRES_BACKUP_LOG_MAX_SIZE:-20m}"
        max-file: "${MAKEPAD_POSTGRES_BACKUP_LOG_MAX_FILES:-5}"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.infra.makepad.postgres == true
      restart_policy:
        condition: on-failure
        delay: 30s
      resources:
        limits:
          cpus: "${MAKEPAD_POSTGRES_BACKUP_CPU_LIMIT:-1.0}"
          memory: ${MAKEPAD_POSTGRES_BACKUP_MEMORY_LIMIT:-1G}
        reservations:
          cpus: "${MAKEPAD_POSTGRES_BACKUP_CPU_RESERVATION:-0.1}"
          memory: ${MAKEPAD_POSTGRES_BACKUP_MEMORY_RESERVATION:-128M}

networks:
  db:
    external: true
    name: ${MAKEPAD_POSTGRES_DB_NETWORK}
  le_petit_coin:
    external: true
    name: ${MAKEPAD_POSTGRES_LE_PETIT_COIN_DB_NETWORK}
  brio_staging:
    external: true
    name: ${MAKEPAD_POSTGRES_BRIO_STAGING_DB_NETWORK:?set MAKEPAD_POSTGRES_BRIO_STAGING_DB_NETWORK}
